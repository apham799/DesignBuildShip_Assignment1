<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alan Pham — Skyline</title>
  <meta name="description" content="Alan Pham, HCI researcher and Pre-Doctoral MPCS student at the University of Chicago. A transit map printed on a lab floor, where every stop is a balloon and its height is when it happened.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#detail">Skip to details</a>

  <header class="top">
    <a class="back" href="../../index.html" aria-label="Back to the design log"><span aria-hidden="true">&larr;</span> <span class="back-text">Design log</span></a>
    <div class="top-actions">
      <button type="button" data-open="about" aria-pressed="false" aria-controls="detail">About</button>
      <button type="button" data-open="contact" aria-pressed="false" aria-controls="detail">Contact</button>
    </div>
  </header>

  <main class="layout">
    <section class="info" aria-label="Details">
      <div class="card" id="card"></div>
      <div class="detail" id="detail" role="region" aria-label="Stop details" tabindex="-1"></div>
      <ol class="route-list" id="route-list" aria-label="All stops, oldest first"></ol>
    </section>

    <section class="room" id="room" aria-label="A transit map printed on the floor of a lab. Each stop is a balloon; higher balloons are later.">
      <div class="wall" aria-hidden="true"></div>
      <div class="floor" aria-hidden="true"></div>
      <div class="scene" id="scene">
        <div class="plane" id="plane"></div>
      </div>
      <div class="key" aria-hidden="true">
        <ul id="key-lines"></ul>
        <p><span class="key-balloon"></span> Higher balloon = later</p>
      </div>
      <button type="button" class="pause" id="pause" aria-pressed="false">Pause robots</button>
    </section>
  </main>

  <p class="sr-only" id="status" role="status" aria-live="polite"></p>

  <noscript><p class="noscript">This page draws a 3D map with JavaScript. Contact: apham799@uchicago.edu</p></noscript>

  <script src="../../shared/content.js"></script>
  <script src="script.js"></script>
</body>
</html>
