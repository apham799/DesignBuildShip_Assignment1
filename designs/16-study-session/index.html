<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Alan Pham — The Study Session</title>
  <meta name="description" content="Alan Pham, HCI researcher and Pre-Doctoral MPCS student at the University of Chicago. The portfolio as a user study: consent, seven tasks, an interview question, a questionnaire and a debrief.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#flow">Skip to the session</a>

  <header class="bar">

      <button type="button" class="btn ghost" data-open="about">About</button>

    <div class="page">
      <aside class="info" aria-label="About this study">

        <p class="tagline" id="tagline"></p>
        <figure class="researcher" id="researcher"></figure>
