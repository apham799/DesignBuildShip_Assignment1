<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Alan Pham — The Affinity Wall</title>
  <meta name="description" content="Alan Pham, HCI researcher and Pre-Doctoral MPCS student at the University of Chicago. An affinity wall: every stop on my path is a sticky note you can sort by time, topic or place, or drag around.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#wall">Skip to the wall</a>

  <header class="bar">
    <a class="back" href="../../index.html" aria-label="Back to the design log"><span aria-hidden="true">&larr;</span> <span class="back-text">Design log</span></a>
    <div class="bar-actions">
      <button type="button" class="btn" data-open="about">About</button>
      <button type="button" class="btn" data-open="contact">Contact</button>
    </div>
  </header>

  <main>
    <section class="head" aria-labelledby="title">
      <figure class="id-photo" id="idPhoto"></figure>
      <div class="intro">
        <p class="eyebrow">An affinity wall: every note is a stop on my path</p>
        <h1 id="title"></h1>
        <p class="tagline" id="tagline"></p>
        <p class="lab" id="lab"></p>
      </div>
      <div class="controls">
        <p class="controls-title" id="sortLabel">Sort the wall</p>
        <div class="sorts" role="group" aria-labelledby="sortLabel" id="sorts"></div>
        <p class="controls-hint">Drag a note by its top strip, or open it to read more.</p>
      </div>
    </section>

    <ul class="legend" id="legend" aria-label="Key"></ul>

    <section class="board" aria-label="The wall">
      <div class="wall" id="wall"></div>
    </section>
  </main>

  <dialog id="dlg" aria-labelledby="dlg-title">
    <div class="dlg-note" id="dlgNote">
      <form method="dialog"><button class="close" aria-label="Close this note">Close <span aria-hidden="true">&times;</span></button></form>
      <div id="dlgBody"></div>
    </div>
  </dialog>

  <p class="sr-only" id="status" role="status" aria-live="polite"></p>
  <noscript><p class="noscript">This page is a wall of sticky notes that needs JavaScript. Contact: apham799@uchicago.edu</p></noscript>

  <script src="../../shared/content.js"></script>
  <script src="script.js"></script>
</body>
</html>
